services:
  # Backend API Service
  api:
    build:
      context: .
      target: development
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=learnx
      - MONGODB_URI=mongodb://mongodb:27017/learnx
      - REDIS_URL=redis://:redis123@redis:6379
      - ENABLE_REDIS=true
      - QDRANT_URL=http://qdrant:6333
      - ASR_ENABLED=true
      - ENABLE_ASR_FALLBACK=true
      - FULL_AUDIO_TRANSCRIBE=true
      - ASR_PROVIDER=local
      - ASR_SERVER_URL=http://asr-server:8000
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=info
    volumes:
      - .:/usr/src/app
      - api_node_modules:/usr/src/app/node_modules
      - ./logs:/usr/src/app/logs
    depends_on:
      - postgres
      - redis
      - qdrant
      - asr-server
    networks:
      - learnx-network
    restart: unless-stopped

  # PostgreSQL Database (Primary)
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=learnx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - learnx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database (Legacy/Optional)
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=learnx
    volumes:
      - mongodb_data:/data/db
    networks:
      - learnx-network
    restart: unless-stopped
    profiles:
      - legacy

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - learnx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - learnx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ASR Server (Vosk Speech Recognition)
  asr-server:
    build:
      context: ../asr-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ASR_PORT=8000
      - FFMPEG_PATH=/usr/bin/ffmpeg
    volumes:
      - ../asr-server/models:/app/models:ro
    networks:
      - learnx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # pgAdmin (PostgreSQL Admin Interface - optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@learnx.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - learnx-network
    restart: unless-stopped
    profiles:
      - admin

  # MongoDB Admin Interface (optional)
  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password123
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password123@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongodb
    networks:
      - learnx-network
    restart: unless-stopped
    profiles:
      - admin
      - legacy

  # Redis Admin Interface (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis123
    depends_on:
      - redis
    networks:
      - learnx-network
    restart: unless-stopped
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  pgadmin_data:
    driver: local
  api_node_modules:
    driver: local

networks:
  learnx-network:
    driver: bridge
